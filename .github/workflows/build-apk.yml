name: Build APK and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Run Tests and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --no-install

      - name: Ensure Keystore Exists
        run: |
          mkdir -p android/app
          if [ -f android-keystore/imperio-galletil.keystore ]; then
            cp android-keystore/imperio-galletil.keystore android/app/imperio-galletil.keystore
          fi

      - name: Build Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/Imperio-Galletil.apk
          cp version.json build-output/version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Imperio-Galletil-APK
          path: build-output/Imperio-Galletil.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Imperio Galletil Mobile v1.0.${{ github.run_number }}"
          body: |
            Compilacion automatica exitosa de Imperio Galletil.
            
            Pruebas unitarias aprobadas al 100%.
            
            Descarga directa del APK para instalacion o actualizacion directa:
            [Imperio-Galletil.apk](https://github.com/Raxcs/Imperio-Galletil/releases/latest/download/Imperio-Galletil.apk)
          draft: false
          prerelease: false
          files: |
            build-output/Imperio-Galletil.apk
            build-output/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
